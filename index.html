<!doctype html>
<!--
  OSMC Log Analyzer
  =================
  A single page that reads an OSMC log (made with `grab-logs -A`) and shows the useful parts:
  settings, display/audio capabilities, storage, packages, Kodi log errors, playbacks and banned add-ons.
  Everything runs in the browser; the log file is never uploaded anywhere.

  Files
    index.html        markup (this file)
    js/*.js           the JavaScript, see below
    style.css         all styling (colour tokens, dark mode, layout)
    lang/en.json      English UI texts      } key = English source text used in the code,
    lang/da.json      Danish UI texts       } value = text shown on screen
    banned-wiki.json  server copy of Kodi's "Banned add-ons" wiki page (refreshed when the page is updated on the server)
    .htaccess         makes browsers revalidate html/css/js/json so updates show without a forced reload
    test.html         findings test for development: runs the checks on the example logs (not needed on the server)

  How the script is organised
  Plain scripts (no modules or build step), loaded in this order at the end of the page. They share their
  top-level names, so a function in one file can use one from another; only main.js runs code at load time.
    js/core.js      i18n (loads lang/*.json, provides T() for translated text) and helpers: esc(), kv(), table(),
                    card(), badge() …
    js/parsers.js   parseLog() cuts the log file into its named sections; one parse function per section type
                    (uname, guisettings, df, EDID, Kodi log …); settings group labels
    js/banned.js    loads/updates the kodi.wiki banned add-ons list and matches installed add-ons against it
    js/rules.js     rule-based checks (RULES) shown in the Problems tab and the overview; known harmless messages
    js/render.js    buildData() parses everything the tabs and rules use; render() builds every tab as HTML and
                    wires up the interactive parts
    js/main.js      DA/EN switch, file picker / drag & drop -> load() -> render(), start-up

  How to …
    add a translated text   write T('English text') in the code and add the same key to
                            lang/en.json and lang/da.json (a missing key just shows the English text)
    read a new log section  use log.sec('Section name') in buildData() or render(); the name is the one between
                            the ===== markers in the log
    add a check             add a rule to RULES in js/rules.js (see the comment above it); its findings show up
                            in the Problems tab and the overview. Run test.html afterwards to see what changed
                            in the findings of the example logs.
    add a tab               build an HTML string in render() and call addTab(id, T('label'), html)
    add a script file       add a <script src> before main.js below, and to the copy step on the server
-->
<!-- data-theme: the page always starts dark; the light/dark button in the header switches it (main.js) -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSMC Log Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  Static texts carry their translation key in data-i18n (plain text) or data-i18n-html (may contain markup);
  applyLang() replaces their content with the text for the current language.
-->
<!-- Sticky header: title, file info, light/dark switch, language switch, load/paste buttons and (after loading) the tab bar -->
<header>
  <h1 data-i18n="OSMC Log Analyzer">OSMC Log Analyzer</h1>

  <span class="file" id="fileinfo"></span>
  <span class="spacer"></span>
  <button id="theme" class="icon"></button>
  <span class="langsw" id="langsw"><button data-lang="en">EN</button><button data-lang="da">DA</button></span>
  <button id="reload" hidden data-i18n="Load another log">Load another log</button>
  <button id="repaste" hidden data-i18n="Paste another log">Paste another log</button>
  <input type="file" id="file" accept=".log,.txt,text/plain" hidden>
  <!-- Tab buttons are generated by render() -->
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main>
  <!-- Start screen: drop zone / file picker, and a field to paste the log's text into. Hidden once a log is loaded. -->
  <div id="start">
    <div id="drop">
      <h2 data-i18n="Drop an OSMC log file here">Drop an OSMC log file here</h2>
      <p data-i18n-html="or click to choose a file (e.g. <code>osmc.log</code> from <code>grab-logs -A</code>)">or click to choose a file (e.g. <code>osmc.log</code> from <code>grab-logs -A</code>)</p>
      <p data-i18n="The file is only read in your browser and is not sent anywhere.">The file is only read in your browser and is not sent anywhere.</p>
    </div>
    <textarea id="paste" rows="3" spellcheck="false" data-i18n-placeholder="…or paste the whole log here (Ctrl+V)" placeholder="…or paste the whole log here (Ctrl+V)"></textarea>
    <p class="repo"><a href="https://github.com/taaning/OSMC-Log-Analyzer" target="_blank" rel="noopener" data-i18n="Source code on GitHub">Source code on GitHub</a></p>
  </div>
  <!-- Result view: one .panel per tab is generated into #panels by render() -->
  <div id="app" hidden>
    <div id="panels"></div>
  </div>
</main>
<!-- Shown over the page while a log is read and analysed (main.js busy()) -->
<div id="busy" hidden role="status" aria-live="polite"><div class="spinner"></div><p id="busy-text"></p></div>
<!-- The scripts share their top-level names; main.js starts the page, so it comes last. -->
<script src="js/core.js"></script>
<script src="js/parsers.js"></script>
<script src="js/banned.js"></script>
<script src="js/rules.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
