<!doctype html>
<!--
  OSMC Log Analyzer
  =================
  A single page that reads an OSMC log (made with `grab-logs -A`) and shows the useful parts:
  settings, display/audio capabilities, storage, packages, Kodi log errors, playbacks and banned add-ons.
  Everything runs in the browser; the log file is never uploaded anywhere.

  Files
    index.html        markup + all JavaScript (this file)
    style.css         all styling (colour tokens, dark mode, layout)
    lang/en.json      English UI texts      } key = English source text used in the code,
    lang/da.json      Danish UI texts       } value = text shown on screen
    banned-wiki.json  server copy of Kodi's "Banned add-ons" wiki page (refreshed by deploy.sh)
    .htaccess         makes browsers revalidate html/css/json so updates show without a forced reload
    deploy.sh         copies everything to the web server

  How the script is organised (top to bottom)
    i18n            loads lang/*.json and provides T() for translated text
    helpers         small HTML builders: esc(), kv(), table(), card(), badge() …
    splitting       parseLog() cuts the log file into its named sections
    parsers         one parse function per section type (uname, guisettings, df, EDID, Kodi log …)
    banned add-ons  loads/updates the kodi.wiki list and matches installed add-ons against it
    problems        rule-based checks (RULES) shown in the Problems tab and the overview
    rendering       render() builds every tab as HTML and wires up the interactive parts
    language        DA/EN switch
    loading         file picker / drag & drop -> load() -> render()

  How to …
    add a translated text   write T('English text') in the code and add the same key to
                            lang/en.json and lang/da.json (a missing key just shows the English text)
    read a new log section  use log.sec('Section name') inside render(); the name is the one between
                            the ===== markers in the log
    add a check             add a rule to RULES (see the comment above it); its findings show up in the
                            Problems tab and the overview
    add a tab               build an HTML string in render() and call addTab(id, T('label'), html)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSMC Log Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  Static texts carry their translation key in data-i18n (plain text) or data-i18n-html (may contain markup);
  applyLang() replaces their content with the text for the current language.
-->
<!-- Sticky header: title, file info, language switch, reload button and (after loading) the tab bar -->
<header>
  <h1 data-i18n="OSMC Log Analyzer">OSMC Log Analyzer</h1>
  <span class="file" id="fileinfo"></span>
  <span class="spacer"></span>
  <span class="langsw" id="langsw"><button data-lang="en">EN</button><button data-lang="da">DA</button></span>
  <button id="reload" hidden data-i18n="Load another log">Load another log</button>
  <input type="file" id="file" accept=".log,.txt,text/plain" hidden>
  <!-- Tab buttons are generated by render() -->
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main>
  <!-- Start screen: drop zone / file picker. Hidden once a log is loaded. -->
  <div id="drop">
    <h2 data-i18n="Drop an OSMC log file here">Drop an OSMC log file here</h2>
    <p data-i18n-html="or click to choose a file (e.g. <code>osmc.log</code> from <code>grab-logs -A</code>)">or click to choose a file (e.g. <code>osmc.log</code> from <code>grab-logs -A</code>)</p>
    <p data-i18n="The file is only read in your browser and is not sent anywhere.">The file is only read in your browser and is not sent anywhere.</p>
  </div>
  <!-- Result view: one .panel per tab is generated into #panels by render() -->
  <div id="app" hidden>
    <div id="panels"></div>
  </div>
</main>
<script>
'use strict';

// ---------- i18n ----------
// English source text is the key; lang/<code>.json maps it to the shown text. {0}, {1}… are placeholders.
// A missing key falls back to the English text, so a missing or broken file never breaks the page.
const LANGS = {};   // loaded language files: { en: {...}, da: {...} }
// English is the default; a language picked with the DA/EN buttons is remembered. To add a language,
// add it here, add a button in the header and create lang/<code>.json.
let lang = 'en';
try { lang = localStorage.getItem('osmclog.lang') || 'en'; } catch {}
if (!['en', 'da'].includes(lang)) lang = 'en';
// Fetches lang/<code>.json once; a failed fetch is stored as {} so T() falls back to English.
async function loadLang(code) {
  if (LANGS[code]) return;
  try {
    const r = await fetch(`lang/${code}.json`, { cache: 'no-cache' });
    LANGS[code] = r.ok ? await r.json() : {};
  } catch { LANGS[code] = {}; }
}
// T('English text', arg0, arg1 …) -> translated text with {0}, {1} … filled in. Returns plain text (not HTML-escaped).
const T = (s, ...a) => ((LANGS[lang] && LANGS[lang][s]) || s).replace(/\{(\d)\}/g, (_, i) => a[i]);

// ---------- helpers ----------
// Most of the page is built as HTML strings. Values from the log are untrusted, so they are always
// passed through esc() — or wrapped in raw() when a value is HTML we built ourselves.

// Text that grab-logs puts in place of passwords and other private values.
const MASK = '**masked*by*grab-logs**';
// Escapes text for safe use inside HTML.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Marks a string as ready-made HTML so kv()/table() insert it as-is instead of escaping it.
class Raw { constructor(h) { this.h = h; } }
const raw = h => new Raw(h);
// Cell content: raw HTML stays, anything else is escaped.
const val = v => v instanceof Raw ? v.h : esc(v);
// Small pill label. cls: '' (grey), 'ok' (green), 'warn' (amber), 'bad' (red), 'acc' (blue).
const badge = (t, cls = '') => `<span class="badge ${cls}">${esc(t)}</span>`;
// Shows true/'true' and false/'false' as Yes/No badges; other values are passed through unchanged.
const yesNo = v => v === true || v === 'true' ? raw(badge(T('Yes'), 'ok')) : v === false || v === 'false' ? raw(badge(T('No'))) : v;
// Replaces a value masked by grab-logs with a "masked" badge.
const unmask = v => String(v ?? '').includes(MASK) ? raw(badge(T('masked by grab-logs'))) : v;

// Two-column key/value table from [[label, value], …]. Rows with an empty value are skipped.
function kv(rows) {
  rows = rows.filter(r => r && r[1] !== undefined && r[1] !== null && r[1] !== '');
  if (!rows.length) return `<p class="empty">${T('No data')}</p>`;
  return '<div class="tw"><table class="kv">' + rows.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${val(v)}</td></tr>`).join('') + '</table></div>';
}
// Data table. rows: arrays of cell values; a row may carry a .cls property for a CSS class on the <tr>
// (e.g. 'changed' for the blue left border). opts.scroll: limit the height and scroll inside the card.
// The table is wrapped in .tw so wide tables scroll sideways on phones instead of widening the page.
function table(headers, rows, opts = {}) {
  if (!rows.length) return `<p class="empty">${T('No data')}</p>`;
  const body = rows.map(r => {
    const cls = r.cls ? ` class="${r.cls}"` : '';
    return `<tr${cls}>` + r.map(c => `<td>${val(c)}</td>`).join('') + '</tr>';
  }).join('');
  // opts.cols: fixed column widths (e.g. ['45%', '35%', '20%']) so rows line up and long values wrap
  const cols = opts.cols ? `<colgroup>${opts.cols.map(w => `<col style="width:${w}">`).join('')}</colgroup>` : '';
  const t = `<table${opts.cols ? ' class="fixed"' : ''}>${cols}<thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
  return `<div class="tw${opts.scroll ? ' scroll' : ''}">${t}</div>`;
}
// A boxed section with a title. body is HTML; sub is a small grey HTML note after the title (escape it yourself).
const card = (title, body, sub = '') => `<section class="card"><h3>${esc(title)}${sub ? ` <span class="sub">${sub}</span>` : ''}</h3>${body}</section>`;
// Usage bar; turns amber from 80 % and red from 90 %.
const bar = pct => `<div class="bar"><span class="${pct >= 90 ? 'bad' : pct >= 80 ? 'warn' : ''}" style="width:${Math.min(100, pct)}%"></span></div>`;
// Decodes the basic XML entities found in setting values.
const xmlDecode = s => String(s ?? '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

// Seconds -> "2 d 3 t 15 min" (seconds are only shown for durations under an hour).
function fmtDuration(sec) {
  sec = Math.round(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const hu = lang === 'en' ? ' h' : ' t';
  return [d && d + ' d', h && h + hu, m && m + ' min', (!d && !h) && s + ' s'].filter(Boolean).join(' ');
}
// Bytes -> "1.3 MB".
function fmtBytes(n) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}

// grab-logs sometimes double-encodes UTF-8 (e.g. "OvervÃ¥gning"); repair those lines.
function fixMojibake(text) {
  const dec = new TextDecoder('utf-8', { fatal: true });
  return text.replace(/[^\n]*[\u00c2-\u00df][\u0080-\u00bf][^\n]*/g, line => {
    if (/[^\u0000-\u00ff]/.test(line)) return line;
    try { return dec.decode(Uint8Array.from(line, c => c.charCodeAt(0))); } catch { return line; }
  });
}

// ---------- splitting ----------
// A grab-logs file starts with a header ("Logs created on: … (Uptime = …)" and a table of contents),
// followed by sections wrapped in markers that share a random id:
//   ====================== Kodi Log =================== HyhIT4UP
//   …section content…
//   ---------------------- Kodi Log END --------------- HyhIT4UP
// Returns { sections: [{ name, id, startLine, lines, text, truncated? }], byName, created, uptime, sec(name) }.
// sec(name) returns a section's text, or '' if the section is missing, so callers never need null checks.
function parseLog(text) {
  const lines = text.split(/\r?\n/);
  const startRe = /^={6,} (.+?) ={6,} (\S+)\s*$/;
  const endRe = /^-{6,} (.+?) END -{6,} (\S+)\s*$/;
  const sections = [], byName = {}, header = [];
  let cur = null;
  const close = () => {
    while (cur.lines.length && !cur.lines[cur.lines.length - 1].trim()) cur.lines.pop();
    cur.text = cur.lines.join('\n');
    sections.push(cur);
    byName[cur.name] = cur;
    cur = null;
  };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i]; let m;
    if (cur) {
      if ((m = endRe.exec(l)) && m[2] === cur.id) { close(); continue; }
      cur.lines.push(l);
    } else if ((m = startRe.exec(l))) {
      // startLine is the 1-based line number of the section's first content line in the original file
      cur = { name: m[1], id: m[2], startLine: i + 2, lines: [] };
    } else if (!sections.length) header.push(l);
  }
  // a section without an END marker means the file was cut off
  if (cur) { cur.truncated = true; close(); }
  const h = header.join('\n');
  const created = /Logs created on:\s*(.+?)\s*-\s*\(Uptime\s*=\s*([\d.]+)\)/.exec(h);
  return {
    sections, byName,
    created: created && created[1],
    uptime: created && parseFloat(created[2]),
    sec: name => byName[name] ? byName[name].text : '',
  };
}

// ---------- parsers ----------
// Each parser takes the text of one section (log.sec('…')) and returns plain data; no HTML is built here.
// They are forgiving: unexpected lines are skipped rather than throwing.

// "UNAME": `uname -a` -> { host, kernel, arch }.
function parseUname(t) {
  const p = t.trim().split(/\s+/);
  return { host: p[1], kernel: p[2], arch: p[p.length - 2] };
}
// "cmdline": kernel command line -> { key: value } (flags without '=' get the value true).
function parseCmdline(t) {
  const o = {};
  for (const tok of t.trim().split(/\s+/)) {
    const i = tok.indexOf('=');
    if (i > 0) o[tok.slice(0, i)] = tok.slice(i + 1); else if (tok) o[tok] = true;
  }
  return o;
}
// "GUI Settings (abridged)": lines like "Name: value" or "Name: value ===> Default: x".
// The "===> Default" part only appears when the setting differs from its default.
// -> [{ name, value, def, changed }]
function parseAbridged(t) {
  // split on ": " so names like "Display 4:3 videos as" stay intact
  return t.split('\n').filter(l => l.includes(': ')).map(l => {
    const i = l.indexOf(': ');
    const name = l.slice(0, i).trim();
    let value = l.slice(i + 2).trim(), def = null;
    const m = /^(.*?)\s*===>\s*Default:\s*(.*)$/.exec(value);
    if (m) { value = m[1]; def = m[2]; }
    return { name, value, def, changed: def !== null };
  });
}
// "guisettings.xml": every <setting id="…">. Kodi adds default="true" to settings left at their default,
// so a setting without it has been changed. A regex is used instead of DOMParser because grab-logs'
// masking can leave the XML slightly broken. -> [{ id, isDefault, value }]
function parseGuiSettings(t) {
  const out = [];
  const re = /<setting id="([^"]+)"((?:\s+\w+="[^"]*")*)\s*(?:\/>|>([\s\S]*?)<\/setting>)/g;
  let m;
  while ((m = re.exec(t))) {
    out.push({ id: m[1], isDefault: /default="true"/.test(m[2]), value: xmlDecode(m[3] ?? '') });
  }
  return out;
}
// Child elements of one <tag>…</tag> block as [[name, value], …] (used for <defaultvideosettings> etc.).
function parseSimpleXmlBlock(t, tag) {
  const m = new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`).exec(t);
  if (!m) return [];
  const out = []; const re = /<(\w+)>([^<]*)<\/\1>/g; let x;
  while ((x = re.exec(m[1]))) out.push([x[1], xmlDecode(x[2])]);
  return out;
}
// Parses well-formed XML into a DOM document; returns null for empty or invalid XML.
function parseXml(t) {
  if (!t.trim().startsWith('<')) return null;
  const doc = new DOMParser().parseFromString(t.replace(/^\uFEFF/, ''), 'application/xml');
  return doc.querySelector('parsererror') ? null : doc;
}
// Flatten an XML tree into [path, value] rows, e.g. ["videodatabase › host", "192.168.1.69"].
function flattenXml(el, prefix = '') {
  const rows = [];
  for (const c of el.children) {
    const attrs = [...c.attributes].map(a => `${a.name}="${a.value}"`).join(' ');
    const p = prefix + c.tagName + (attrs ? ` [${attrs}]` : '');
    if (c.children.length) rows.push(...flattenXml(c, p + ' › '));
    else rows.push([p, c.textContent.trim()]);
  }
  return rows;
}
// "sources.xml": media sources -> [{ type (video/music/…), name, paths, isDefault }].
function parseSources(t) {
  const doc = parseXml(t);
  if (!doc) return [];
  const out = [];
  for (const type of doc.documentElement.children) {
    const def = type.querySelector(':scope > default')?.textContent.trim();
    for (const s of type.querySelectorAll(':scope > source')) {
      out.push({
        type: type.tagName,
        name: s.querySelector('name')?.textContent.trim(),
        paths: [...s.querySelectorAll('path')].map(p => p.textContent.trim()),
        isDefault: def && def === s.querySelector('name')?.textContent.trim(),
      });
    }
  }
  return out;
}
// "fstab": non-comment lines -> [{ spec, mnt, type, opts, dump, pass }].
function parseFstab(t) {
  return t.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => {
    const [spec, mnt, type, opts, dump, pass] = l.split(/\s+/);
    return { spec, mnt, type, opts, dump, pass };
  });
}
// "mounts" (/proc/mounts) -> [{ spec, mnt, type, opts }].
function parseMounts(t) {
  return t.split('\n').filter(Boolean).map(l => {
    const [spec, mnt, type, opts] = l.split(/\s+/);
    return { spec, mnt, type, opts };
  });
}
// "Diskspace" (`df -h`) -> [{ fs, size, used, avail, pct, mnt }].
function parseDf(t) {
  const lines = t.split('\n').filter(Boolean);
  return lines.slice(1).map(l => {
    const p = l.split(/\s+/);
    if (p.length < 6) return null;
    return { fs: p[0], size: p[1], used: p[2], avail: p[3], pct: parseInt(p[4]), mnt: p.slice(5).join(' ') };
  }).filter(Boolean);
}
// "Memory" (`free -m`) -> { Mem: { total, used, free, shared, cache, avail }, Swap: {…} } in MB.
function parseFree(t) {
  const out = {};
  for (const l of t.split('\n')) {
    const m = /^(Mem|Swap):\s+(.*)$/.exec(l.trim());
    if (m) {
      const n = m[2].split(/\s+/).map(Number);
      out[m[1]] = { total: n[0], used: n[1], free: n[2], shared: n[3], cache: n[4], avail: n[5] };
    }
  }
  return out;
}
// "ifconfig": one block per interface (a block starts with a non-indented line) -> addresses, traffic and error counters.
function parseIfconfig(t) {
  const blocks = t.split(/\n(?=\S)/).filter(b => b.trim());
  return blocks.map(b => {
    const g = re => (re.exec(b) || [])[1];
    return {
      name: g(/^(\S+?):/),
      flags: g(/flags=\S*<([^>]*)>/),
      inet: g(/\binet (\S+)/), mask: g(/netmask (\S+)/), inet6: g(/\binet6 (\S+)/),
      ether: g(/ether (\S+)/), type: g(/\(([^)]+)\)\s*$/m),
      rx: g(/RX packets \d+\s+bytes \d+ \(([^)]+)\)/), tx: g(/TX packets \d+\s+bytes \d+ \(([^)]+)\)/),
      rxErr: g(/RX errors (\d+)/), txErr: g(/TX errors (\d+)/), dropped: g(/RX errors \d+\s+dropped (\d+)/),
    };
  }).filter(i => i.name);
}
// "OSMC Packages" / "All Other Packages" (`dpkg -l`) -> [{ status ('ii' = installed), name, version, arch, desc }].
function parseDpkg(t) {
  return t.split('\n').map(l => /^([a-zA-Z]{2,3})\s+(\S+)\s+(\S+)\s+(\S+)\s+(.*)$/.exec(l)).filter(Boolean)
    .filter(m => !m[1].startsWith('Desired') && m[1] !== '||')
    .map(m => ({ status: m[1], name: m[2], version: m[3], arch: m[4], desc: m[5] }));
}
// "APT history.log": blank-line separated runs (Start-Date, Commandline, Install/Upgrade/Remove/Purge, End-Date)
// -> runs, newest first, with package lists split into one entry per package.
function parseAptHistory(t) {
  return t.split(/\n\s*\n/).map(b => {
    const g = k => (new RegExp(`^${k}: (.*)$`, 'm').exec(b) || [])[1];
    const pkgs = k => { const v = g(k); return v ? v.split(/\),\s*/).map(s => s.replace(/\)?$/, ')')) : []; };
    const start = g('Start-Date');
    if (!start) return null;
    return {
      start: start.replace(/\s+/, ' '), end: (g('End-Date') || '').replace(/\s+/, ' '),
      cmd: g('Commandline') || '', requested: g('Requested-By'),
      install: pkgs('Install'), upgrade: pkgs('Upgrade'), remove: pkgs('Remove'), purge: pkgs('Purge'),
      error: g('Error'),
    };
  }).filter(Boolean).sort((a, b) => b.start.localeCompare(a.start));
}
// Raspberry Pi model ("Raspberry Pi 400 Rev 1.1", from the kernel's "Machine model:" line) -> SoC.
// Kodi's "Running on" line can't be used: the Pi kernel reports "BCM2835" in /proc/cpuinfo on every model.
function piSoc(model) {
  const m = model.replace(/^Raspberry Pi\s*/, '');
  if (/^(5|500|Compute Module 5)\b/.test(m)) return 'Broadcom BCM2712';
  if (/^(4|400|Compute Module 4)/.test(m)) return 'Broadcom BCM2711';
  if (/^Zero 2/.test(m)) return 'RP3A0 (Broadcom BCM2710A1)';
  if (/^3 Model [AB] Plus|^Compute Module 3 Plus/.test(m)) return 'Broadcom BCM2837B0';
  if (/^(3|Compute Module 3)\b|^2 Model B Rev 1\.2/.test(m)) return 'Broadcom BCM2837';
  if (/^2\b/.test(m)) return 'Broadcom BCM2836';
  if (/^(Model|Zero|Compute Module\b(?! \d))/.test(m)) return 'Broadcom BCM2835';
  return '';
}
// HDMI/CTA-861 Video Identification Codes -> readable mode ("Display Mode" shows e.g. "VIC:16").
const VIC = {
  1: '640x480p60', 2: '480p60', 3: '480p60', 4: '720p60', 5: '1080i60', 16: '1080p60', 17: '576p50', 18: '576p50',
  19: '720p50', 20: '1080i50', 31: '1080p50', 32: '1080p24', 33: '1080p25', 34: '1080p30', 60: '720p24', 61: '720p25', 62: '720p30',
  93: '2160p24', 94: '2160p25', 95: '2160p30', 96: '2160p50', 97: '2160p60',
  98: '4096x2160p24', 99: '4096x2160p25', 100: '4096x2160p30', 101: '4096x2160p50', 102: '4096x2160p60',
};
// Lines indented under a header line in edid-decode output (also used for "Dolby Vision Cap").
// Returns the trimmed child lines, or null when the header is not found.
function indentedBlock(t, headerRe) {
  const lines = t.split('\n');
  const i = lines.findIndex(l => headerRe.test(l));
  if (i < 0) return null;
  const ind = lines[i].search(/\S/);
  const out = [];
  for (let j = i + 1; j < lines.length; j++) {
    const l = lines[j];
    if (!l.trim()) continue;
    if (l.search(/\S/) <= ind) break;
    out.push(l.trim());
  }
  return out;
}
// "EDID" (Amlogic's summary of the TV's EDID): "Key: value" lines -> { key: value } (first occurrence wins).
// flagsLine is the line without a colon that lists HDR/Dolby Vision/deep colour support.
function parseEdid(t) {
  const o = {};
  for (const l of t.split('\n')) {
    const m = /^([^:{]+?):\s*(.*)$/.exec(l);
    if (m && !o[m[1].trim()]) o[m[1].trim()] = m[2].trim();
  }
  o.flagsLine = (t.split('\n').find(l => /HDR|DolbyVision|DeepColor/.test(l) && !l.includes(':')) || '').trim();
  return o;
}
// "Audio Cap": audio formats the TV/receiver reports -> [[format, channels, sample rates, …extra]]
// (the first line is a column header and is skipped).
function parseAudioCap(t) {
  return t.split('\n').slice(1).filter(l => l.includes(',')).map(l => l.split(',').map(s => s.trim()));
}

// "Kodi Log" / "Kodi Old Log": lines like
//   2026-10-31 09:30:46.882 T:2971     info <general>: message
// -> [{ date, time, thread, level, comp, msg, extra, line }]. Lines without a timestamp (e.g. dumped XML)
// are continuation lines and are collected in the previous entry's `extra`. `line` is the 0-based line
// within the section, used to jump to the entry in the Raw sections tab.
function parseKodiLog(t) {
  const re = /^(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d\.\d+) T:(\d+)\s+(\w+) <([^>]+)>: ?(.*)$/;
  const entries = []; let last = null;
  for (const [i, l] of t.split('\n').entries()) {
    const m = re.exec(l);
    if (m) { last = { date: m[1], time: m[2], thread: m[3], level: m[4].toLowerCase(), comp: m[5], msg: m[6], extra: [], line: i }; entries.push(last); }
    else if (last && l.trim()) last.extra.push(l.trim());
  }
  return entries;
}
// Walks the Kodi log entries once and collects everything the page shows:
//   levels        count per log level           info        version, platform, skin, cache settings …
//   addons        Map id -> version             groups      errors/warnings grouped by message
//   devices       ALSA audio devices            playbacks   one object per VideoPlayer::OpenFile
//   resolutions   display mode switches         repoErrors  repositories Kodi complained about
// To pick up something new from the Kodi log, add a regex to the if/else chain below.
function analyzeKodi(entries) {
  const a = { levels: {}, info: {}, addons: new Map(), groups: new Map(), devices: [], playbacks: [], resolutions: [], debugLogging: false, repoErrors: new Set() };
  const lastByThread = {};
  let dev = null, pb = null;
  const devMap = new Map();
  for (const e of entries) {
    a.levels[e.level] = (a.levels[e.level] || 0) + 1;
    const msg = e.msg;
    let m;
    if (!a.first) a.first = e; a.last = e;
    if ((m = /^Starting Kodi \(([^)]+)\)\. Platform: (.*)$/.exec(msg))) { a.info.version = m[1]; a.info.platform = m[2]; }
    else if ((m = /^Running on (.*)$/.exec(msg))) a.info.runningOn = m[1];
    else if ((m = /^FFmpeg version\/source: (.*)$/.exec(msg))) a.info.ffmpeg = m[1];
    else if ((m = /^Local hostname: (.*)$/.exec(msg))) a.info.hostname = m[1];
    else if ((m = /^(\d+) CPU cores available/.exec(msg))) a.info.cores = m[1];
    else if ((m = /^Kodi compiled (.*)$/.exec(msg))) a.info.compiled = m[1];
    else if ((m = /^GUI format (.*)$/.exec(msg))) a.info.guiFormat = m[1];
    else if ((m = /^load skin from: \S+ \(version: ([^)]+)\)/.exec(msg))) a.info.skin = (/addons\/([^/]+)\//.exec(msg) || [])[1] + ' ' + m[1];
    else if (msg.startsWith('Enabled debug logging')) a.debugLogging = true;
    else if (msg.startsWith('New Cache GUI Settings')) a.info.cache = e.extra;
    else if ((m = /^CAddonMgr::FindAddons: (\S+) v(\S+) installed/.exec(msg))) a.addons.set(m[1], m[2]);
    else if ((m = /^Repository add-on (\S+) /.exec(msg)) && e.level === 'error') a.repoErrors.add(m[1]);

    // ALSA device enumeration: "Device N" followed by "m_name : value" lines; m_streamTypes is the last one.
    // Kodi enumerates more than once, so devices are de-duplicated by name.
    if ((m = /^\s+Device \d+$/.exec(msg))) { dev = {}; }
    else if (dev && (m = /^\s+m_(\w+)\s*:\s*(.*)$/.exec(msg))) {
      dev[m[1]] = m[2];
      if (m[1] === 'streamTypes') { devMap.set(dev.deviceName, dev); dev = null; }
    }

    // playback tracking: everything between VideoPlayer::OpenFile and CVideoPlayer::CloseFile belongs to that
    // playback (file path, ffmpeg stream info, Dolby Vision record, display mode switch, audio sink setup)
    if ((m = /^VideoPlayer::OpenFile: (.*)$/.exec(msg))) {
      pb = { start: e.date + ' ' + e.time.slice(0, 8), url: m[1], streams: [], dovi: null, res: null, dv: null, audio: [] };
      a.playbacks.push(pb);
    } else if (pb) {
      if (!pb.file && (m = /^CFileCache::Open - <(.+?)> opening/.exec(msg))) pb.file = m[1];
      else if ((m = /^ffmpeg\[[^\]]+\]:\s+Stream #\d+:\d+(\(\w+\))?: (Video|Audio): (.*)$/.exec(msg))) pb.streams.push({ kind: m[2], lang: (m[1] || '').replace(/[()]/g, ''), desc: m[3] });
      else if ((m = /^ffmpeg\[[^\]]+\]:\s+Stream #\d+:\d+(\(\w+\))?: Subtitle: (.*)$/.exec(msg))) pb.subs = (pb.subs || 0) + 1;
      else if ((m = /DOVI configuration record: (.*)$/.exec(msg))) pb.dovi = m[1];
      else if ((m = /^Display resolution (?:ADJUST|SET)\s*: (.*)$/.exec(msg))) pb.res = m[1];
      else if (/^DVCodec: DV support (enabled|disabled)/.test(msg)) pb.dv = msg.replace(/^DVCodec: /, '');
      else if ((m = /^CAESinkALSA::Initialize - (Requested layout .*|Opened device .*|set digital codec .*)$/.exec(msg))) pb.audio.push(m[1]);
      else if (/^CVideoPlayer::CloseFile\(\)/.test(msg) && !pb.end) { pb.end = e.date + ' ' + e.time.slice(0, 8); pb = null; }
    }
    if ((m = /^Display resolution (ADJUST|SET)\s*: (.*)$/.exec(msg))) a.resolutions.push(e.time.slice(0, 8) + '  ' + m[2]);

    // error/warning grouping; "Skipped N duplicate messages" adds to the previous message on that thread
    if (e.level === 'error' || e.level === 'warning' || e.level === 'fatal') {
      if ((m = /^Skipped (\d+) duplicate messages/.exec(msg))) {
        const g = lastByThread[e.thread];
        if (g) g.count += +m[1];
        continue;
      }
      // memory addresses differ between otherwise identical messages, so they are ignored for grouping
      const key = e.level + '|' + msg.replace(/0x[0-9a-f]+/gi, '0x…');
      let g = a.groups.get(key);
      if (!g) { g = { level: e.level, msg, count: 0, first: e.time.slice(0, 8), last: '', firstLine: e.line }; a.groups.set(key, g); }
      g.count++; g.last = e.time.slice(0, 8); g.lastLine = e.line;
      lastByThread[e.thread] = g;
    }
  }
  a.devices = [...devMap.values()];
  return a;
}
// Short video description for a playback: "hevc 3840x2160 24 fps" plus an HDR label.
function summarizeVideo(p) {
  const v = p.streams.find(s => s.kind === 'Video');
  if (!v) return { text: '' };
  const codec = v.desc.split(/[\s,]/)[0];
  const res = (/(\d{3,4}x\d{3,4})/.exec(v.desc) || [])[1] || '';
  const fps = (/([\d.]+) fps/.exec(v.desc) || [])[1];
  let hdr = '';
  if (p.dovi) hdr = 'DV P' + ((/profile: (\d+)/.exec(p.dovi) || [])[1] || '?');
  else if (/smpte2084/.test(v.desc)) hdr = 'HDR10';
  else if (/arib-std-b67/.test(v.desc)) hdr = 'HLG';
  return { text: [codec, res, fps && fps + ' fps'].filter(Boolean).join(' '), hdr };
}
// "System Journal" / "Kernel Message Log": lines matching re, grouped by message so repeats are counted once.
// Numbers are ignored when grouping. -> [{ text, count }], most frequent first.
function groupJournal(t, re) {
  const g = new Map();
  for (const l of t.split('\n')) {
    if (!re.test(l)) continue;
    // drop "Oct 31 09:30:44 host proc[pid]:" prefix to group identical messages
    const m = /^\w{3} +\d+ [\d:.]+ \S+ ([^:\[]+)(?:\[\d+\])?: (.*)$/.exec(l) || /^\[\s*[\d.]+\]\s*(?:())(.*)$/.exec(l);
    const key = m ? (m[1] ? m[1] + ': ' : '') + m[2] : l;
    const k2 = key.replace(/\d+(\.\d+)?/g, '#');
    const e = g.get(k2) || { text: key, count: 0 };
    e.count++; g.set(k2, e);
  }
  return [...g.values()].sort((a, b) => b.count - a.count);
}

// ---------- banned add-ons (kodi.wiki) ----------
// Kodi keeps an example list of banned builds, repositories and add-ons on its wiki. The page's wikitext is
// fetched through the MediaWiki API, which sends Access-Control-Allow-Origin: *, so the browser can fetch it
// directly. Two copies can exist: banned-wiki.json on the server (written by deploy.sh) and one saved in
// this browser by the "Update from kodi.wiki" button; whichever has the newest wiki edit is used.
const BANNED_PAGE = 'https://kodi.wiki/view/Official:Forum_rules/Banned_add-ons';
const BANNED_API = 'https://kodi.wiki/api.php?action=query&prop=revisions&titles=Official:Forum_rules/Banned_add-ons&rvprop=content|timestamp&rvslots=main&format=json&formatversion=2&origin=*';
// Parsed list in use: { ids: Map, names: Map, count, changed, fetched, source } or null when none is loaded.
let banned = null;
// Lower-case letters and digits only, so "Universal Scrapers" and "universalscrapers" compare equal.
const normName = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

// Wikitext lines look like "* Name <!-- ID: repository.x|plugin.video.x -->" under "== Section ==" headings.
// Some names are written as "<Name>" and some ID comments are malformed (e.g. ending in "?>"); both are tolerated.
// json: MediaWiki API response; fetched: ISO date of download; source: 'server' or 'browser'.
function parseBanned(json, fetched, source) {
  const rev = json.query.pages[0].revisions[0];
  const ids = new Map(), names = new Map();
  let sec = '', count = 0;
  for (const l of rev.slots.main.content.split('\n')) {
    let m;
    if ((m = /^==+\s*(.*?)\s*==+/.exec(l))) { sec = m[1]; continue; }
    if (!l.startsWith('*')) continue;
    const name = l.slice(1).replace(/<!--.*$/, '').trim().replace(/^<|>$/g, '').trim();
    if (!name) continue;
    const e = { section: sec, name };
    count++;
    const idm = /<!--\s*ID:\s*(.*?)\s*(?:-->|\?>|$)/.exec(l);
    if (idm) for (const id of idm[1].split('|')) { const k = id.trim().toLowerCase(); if (k) ids.set(k, e); }
    // forks and wizards are not add-on names, so they are not used for name matching
    const n = normName(name);
    if (n.length >= 3 && !/fork|wizard/i.test(sec)) names.set(n, e);
  }
  return { ids, names, count, changed: rev.timestamp, fetched, source };
}
// addons: Map id -> { ver, logs }. Exact ID hit = banned; name of the add-on matching a list entry = possibly banned.
// For the name match the type prefix is dropped: "plugin.video.pov" -> "pov", "repository.umbrella" -> "umbrella".
// -> [{ id, ver, logs, entry: { section, name }, how: 'id' | 'name' }], ID hits first.
function matchBanned(addons) {
  const out = [];
  if (!banned) return out;
  for (const [id, info] of addons) {
    const hit = banned.ids.get(id.toLowerCase());
    if (hit) { out.push({ id, ...info, entry: hit, how: 'id' }); continue; }
    const p = id.split('.');
    if (!['plugin', 'repository', 'script', 'program'].includes(p[0]) || p.length < 2) continue;
    const rest = normName((p[0] === 'repository' || p.length === 2 ? p.slice(1) : p.slice(2)).join(''));
    const e = banned.names.get(rest);
    if (e) out.push({ id, ...info, entry: e, how: 'name' });
  }
  return out.sort((a, b) => (a.how === b.how ? a.id.localeCompare(b.id) : a.how === 'id' ? -1 : 1));
}
// Called once at start-up: reads the browser copy (localStorage) and the server copy (banned-wiki.json).
async function loadBanned() {
  const cand = [];
  try {
    const c = JSON.parse(localStorage.getItem('osmclog.banned') || 'null');
    if (c) cand.push(parseBanned(c.json, c.fetched, 'browser'));
  } catch {}
  try {
    const r = await fetch('banned-wiki.json', { cache: 'no-cache' });
    if (r.ok) {
      const lm = r.headers.get('Last-Modified');
      cand.push(parseBanned(await r.json(), lm ? new Date(lm).toISOString() : '', 'server'));
    }
  } catch {}
  // use whichever copy has the newest wiki edit
  cand.sort((a, b) => (b.changed || '').localeCompare(a.changed || ''));
  banned = cand[0] || null;
}
// "Update from kodi.wiki" button: fetches the live list and saves it in this browser. Throws on failure.
async function refreshBanned() {
  const r = await fetch(BANNED_API, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const json = await r.json();
  const fetched = new Date().toISOString();
  banned = parseBanned(json, fetched, 'browser');
  try { localStorage.setItem('osmclog.banned', JSON.stringify({ json, fetched })); } catch {}
}
// Red "Banned" / amber "Possibly banned" badge for a match, '' for no match.
const bannedBadge = m => m ? (m.how === 'id' ? badge(T('Banned'), 'bad') : badge(T('Possibly banned'), 'warn')) : '';
// The "Banned add-ons" card on the overview: matches, list source/date and the update button.
// The button is handled by the click handler on #panels in render() (data-action="refresh-banned").
function bannedCard(matches, total) {

    `${m.entry.name} (${m.entry.section})`,

      <p class="muted" style="margin:6px 0 0;font-size:12.5px">${esc(T('The list is only examples. An add-on not being on the list does not mean it is allowed.'))}</p>`,
    T('according to the Kodi forum rules'));
}
// ISO date -> local date and time in the current language.
const fmtDate = s => s ? new Date(s).toLocaleString(lang === 'da' ? 'da-DK' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '';

// ---------- problems ----------
// Rule-based checks. The results are shown in the Problems tab, with advice and the log lines that triggered
// them, and as a short list in the overview's Observations card. Every rule has a category, and categories
// can be switched off in the Problems tab (remembered in this browser).
//
// A rule is { cat, check(d) }: check gets the data object built in render() and returns a finding, an array
// of findings (false/undefined entries are skipped) or nothing. A finding is { sev, text, hint, ev }:
//   sev   'bad' (red), 'warn' (amber), 'info' (blue) or 'ok' (green)
//   text  what was found          hint  what to do about it (optional)
//   ev    evidence from find(): { hits: [{ sec, line, n, text }], count } (optional)
// Many patterns are problems that OSMC forum helpers often point out in users' logs.
// To add a check: add a rule to RULES and its texts to lang/en.json and lang/da.json.

// problem categories in display order: id -> English label
const CATS = {
  addons: 'Add-ons', shares: 'Network shares', network: 'Network', crashes: 'Crashes & errors', storage: 'Storage & memory',
  hardware: 'Hardware & power', display: 'Display', audio: 'Audio', updates: 'Updates & packages', database: 'Database', log: 'About the log',
};
const SEV_ORDER = { bad: 0, warn: 1, info: 2, ok: 3 };
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// Kodi log sections, and the section with kernel/system messages (the journal includes the kernel's messages,
// so the kernel log is only used when there is no journal)
const KODI = ['Kodi Log', 'Kodi Old Log'];
const sysSec = d => d.log.sec('System Journal').trim() ? 'System Journal' : 'Kernel Message Log';
// matches Kodi log lines logged at error level (or worse) whose message matches re
const kodiErr = re => new RegExp(String.raw`\s(?:error|fatal) <[^>]+>: .*(?:` + re.source + ')', re.flags);

// Finds the lines of one or more sections that match test (a regex without the g flag, or a function)
// -> { hits (at most max), count }. line is the 0-based line within the section (for jumping to Raw sections),
// n the line number in the file. Missing sections are skipped.
function find(d, secs, test, max = 50) {
  const ok = typeof test === 'function' ? test : l => test.test(l);
  const ev = { hits: [], count: 0 };
  for (const name of [].concat(secs)) {
    const s = d.log.byName[name];
    if (!s) continue;
    s.lines.forEach((l, j) => {
      if (!ok(l)) return;
      ev.count++;
      if (ev.hits.length < max) ev.hits.push({ sec: name, line: j, n: s.startLine + j, text: l });
    });
  }
  return ev;
}
// finding from a find() result: nothing if no lines matched; text/hint get the number of matches as {0}
const found = (sev, ev, text, hint) => ev.count ? { sev, text: T(text, ev.count), hint: hint && T(hint), ev } : null;

// Kodi's view modes (defaultvideosettings/viewmode)
const VIEWMODES = ['Normal', 'Zoom', 'Stretch 4:3', 'Wide zoom', 'Stretch 16:9', 'Original size', 'Custom', 'Stretch 16:9 (non-linear)', 'Zoom 120% width', 'Zoom 110% width'];

const RULES = [
  // --- add-ons ---
  { cat: 'addons', check: d => {
    const ev = list => find(d, KODI, new RegExp(`CAddonMgr::FindAddons: (?:${list.map(m => reEsc(m.id)).join('|')}) v`));
    const ids = d.bannedMatches.filter(m => m.how === 'id'), names = d.bannedMatches.filter(m => m.how === 'name');
    return [
      ids.length && { sev: 'bad', text: T('Banned add-ons installed: {0}.', ids.map(m => m.id).join(', ')),
        hint: T('No support is given on the Kodi and OSMC forums while they are installed. Remove them and make a new log.'), ev: ev(ids) },
      names.length && { sev: 'warn', text: T('Possibly banned add-ons (name matches the list): {0}.', names.map(m => m.id).join(', ')), ev: ev(names) },

  { cat: 'addons', check: d => {

  // --- network shares ---

  } },
  { cat: 'shares', check: d => found('bad', find(d, KODI, kodiErr(/\bNFS\b|nfs:\/\//i)), 'Kodi could not use NFS shares ({0}×).',

  { cat: 'shares', check: d => found('warn', find(d, sysSec(d), /mount error\(\d+\)|failed to parse mount options|CIFS:? VFS: .*(?:error|fail)|Failed to mount|mount\.(?:nfs4?|cifs): |nfs: server \S+ not responding|autofs.*(?:error|fail)/i),

    'Network connection errors in the Kodi log ({0}×).', 'The connection to a server was lost, often during playback. Check cables, the Wi-Fi signal and the server. A wired connection is more reliable.') },
  { cat: 'network', check: d => found('warn', find(d, [...KODI, sysSec(d)], /Could(?:n't| not) resolve|Name or service not known|Temporary failure in name resolution/i),
    'Name lookup (DNS) errors ({0}×).', 'Server names or internet addresses could not be looked up. Check the DNS server in the network settings, or use IP addresses for shares.') },
  { cat: 'network', check: d => {

      return { sev: 'info', text: T('Connected via Wi-Fi ({0}).', wl.name), hint: T('For high-bitrate video (4K, Blu-ray remuxes) a wired connection is more reliable.') };
  } },
  { cat: 'network', check: d => d.ifaces.filter(i => (+i.rxErr || 0) + (+i.txErr || 0) > 0).map(i => ({ sev: 'warn',
    text: T('Network errors on {0}: RX {1}, TX {2}.', i.name, i.rxErr, i.txErr), hint: T('Errors on a network interface often mean a bad cable, port or Wi-Fi signal.') })) },

  // --- crashes & errors ---
  { cat: 'crashes', check: d => found('bad', find(d, sysSec(d), /segfault at|status=(?:11\/SEGV|7\/BUS|6\/ABRT)|SIGSEGV|SIGBUS|core dumped|code=dumped/i),
    'Signs of a program crash ({0}×).', 'If it is Kodi (kodi.bin), a recently installed add-on or skin is a common cause. Crashes during updates can point to a weak power supply or a failing SD card.') },
  { cat: 'crashes', check: d => {
    const top = d.kodi && [...d.kodi.groups.values()].filter(g => g.level === 'error').sort((a, b) => b.count - a.count)[0];
    if (!top || top.count < 50) return;
    const s = d.log.byName['Kodi Log'];
    return { sev: 'warn', text: T('The Kodi log has {0} repeats of the error: “{1}”.', top.count, top.msg.slice(0, 160)),
      hint: T('An error that repeats this often can slow Kodi down and fills the log. It usually points to an add-on, a source or a setting.'),
      ev: { hits: [{ sec: 'Kodi Log', line: top.firstLine, n: s.startLine + top.firstLine, text: s.lines[top.firstLine] }], count: 1 } };
  } },

  // --- storage & memory ---
  { cat: 'storage', check: d => d.df.filter(df => df.pct >= 85 && !/^(tmpfs|devtmpfs)$/.test(df.fs)).map(df => ({ sev: df.pct >= 95 ? 'bad' : 'warn',
    text: T('{0} is {1}% full ({2} free).', df.mnt, df.pct, df.avail), hint: df.mnt === '/' ? T('A full system disk can stop updates and stop Kodi from saving its library and thumbnails.') : '' })) },
  { cat: 'storage', check: d => d.mem.Mem && d.mem.Mem.avail / d.mem.Mem.total < 0.1 && { sev: 'warn', text: T('Low available memory: {0} MB of {1} MB.', d.mem.Mem.avail, d.mem.Mem.total) } },
  { cat: 'storage', check: d => found('bad', find(d, sysSec(d), /Out of memory: Killed process|Memory cgroup out of memory/i),
    'The system ran out of memory and stopped a program ({0}×).', 'Often caused by an add-on or a large cache setting (cache memory size in advancedsettings.xml or under Settings → Services → Caching).') },
  // (a FAT volume that "was not properly unmounted" is the unclean-shutdown rule below, not a disk error)
  { cat: 'storage', check: d => found('bad', find(d, sysSec(d), l => /EXT4-fs error|EXT4-fs \([^)]*\): (?:error|warning)|Buffer I\/O error|I\/O error, dev|blk_update_request: I\/O error|FAT-fs \([^)]*\): .*(?:error|corrupt)|Remounting filesystem read-only|remounted read-only/i.test(l) && !/not properly unmounted/i.test(l)),
    'File system or disk errors ({0}×).', 'The SD card, eMMC or USB disk may be failing or was not removed safely. Back up your data, check the disk and replace the SD card if the errors return.') },
  { cat: 'storage', check: d => found('info', find(d, sysSec(d), /not properly unmounted|was not cleanly unmounted|recovery complete|needs? fsck/i),
    'A disk was not shut down cleanly ({0}×).', 'Usually after a power cut or a USB disk that was pulled out. Shut down from the power menu, and check the disk if errors follow.') },

  // --- hardware & power ---
  { cat: 'hardware', check: d => found('bad', find(d, sysSec(d), /Under-?voltage detected/i),
    'Under-voltage detected ({0}×).', 'The power supply is too weak or its cable too thin. Use the official power supply, and power USB disks through a powered hub.') },
  { cat: 'hardware', check: d => found('warn', find(d, sysSec(d), /usb \S+: (?:device descriptor read\/\S+, error|device not accepting address|unable to enumerate|can't set config|Cannot enable)|over-current/i),
    'USB errors ({0}×).', 'A USB device is not responding properly. Try another port or cable. USB disks may need more power (a powered hub).') },
  { cat: 'hardware', check: d => {
    const ev = find(d, sysSec(d), /hdmitx.*plug ?(?:in|out)\b|HDMI.*hot ?plug|\bhpd\b.*(?:low|high|changed)/i);
    return ev.count >= 6 && found('warn', ev, 'Many HDMI connect/disconnect events ({0}×).',
      'The TV or receiver keeps dropping the HDMI connection. Try another HDMI cable or input, and avoid switches or adapters in between.');
  } },
  { cat: 'hardware', check: d => {
    const ev = find(d, 'Pi config-user', /^\s*(?:arm_freq|over_voltage\w*|core_freq|gpu_freq|sdram_freq|h264_freq|v3d_freq|force_turbo)\s*=/i);
    return ev.count && { sev: 'warn', text: T('Overclocking settings in config-user.txt: {0}.', ev.hits.map(h => h.text.trim()).join(', ')),
      hint: T('Overclocking can cause freezes, crashes and SD card corruption. Remove these lines if the system is unstable.'), ev };
  } },

  // --- display ---
  { cat: 'display', check: d => {
    const ab = d.abridged.find(s => s.name === 'Adjust display refresh rate');
    if (ab && /^Off/i.test(ab.value)) return { sev: 'warn', text: T('Adjust display refresh rate is off. Films at 23.976/24 fps may stutter.'),
      hint: T('Turn it on under Settings → System → Display → Adjust display refresh rate (“On start/stop”).') };
  } },
  { cat: 'display', check: d => found('warn', find(d, KODI, l => /RES_DESKTOP/.test(l) && /640x480/.test(l)),
    'Kodi only found 640x480: the display modes of the TV could not be read ({0}×).',
    'Check the HDMI cable and turn the TV or receiver on before this device. An AV receiver or HDMI switch in between can hide the modes of the TV.') },
  { cat: 'display', check: d => {
    // video calibration per resolution: overscan other than the full screen, or a pixel ratio other than 1
    const gs = d.log.sec('guisettings.xml'), custom = [];
    for (const [, r] of gs.matchAll(/<resolution>([\s\S]*?)<\/resolution>/g)) {
      const g = tag => (new RegExp(`<${tag}>([^<]*)</${tag}>`).exec(r) || [])[1];
      const desc = g('description') || '', wh = /(\d+)x(\d+)/.exec(desc);
      const num = tag => parseFloat(g(tag));
      const shifted = num('left') || num('top') || (wh && ((g('right') && num('right') !== +wh[1]) || (g('bottom') && num('bottom') !== +wh[2])));
      if (shifted || (g('pixelratio') && Math.abs(num('pixelratio') - 1) > 0.001)) custom.push(desc);
    }
    if (!custom.length) return;
    return { sev: 'info', text: T('Custom video calibration (overscan or pixel ratio) for: {0}.', custom.join(', ')),
      hint: T('Can give a cropped, shifted or stretched picture. Reset it under Settings → System → Display → Video calibration.'),
      ev: find(d, 'guisettings.xml', new RegExp(`<description>(?:${custom.map(reEsc).join('|')})</description>`)) };
  } },
  { cat: 'display', check: d => {
    // default view mode for all videos (zoom, stretch, pixel ratio, vertical shift)
    const s = d.log.byName['guisettings.xml'];
    if (!s) return;
    const a = s.lines.findIndex(l => /<defaultvideosettings>/.test(l)), b = s.lines.findIndex(l => /<\/defaultvideosettings>/.test(l));
    if (a < 0 || b < a) return;
    const block = s.lines.slice(a, b).join('\n');
    const g = tag => (new RegExp(`<${tag}>([^<]*)</${tag}>`).exec(block) || [])[1];
    const changed = [], tags = [];
    const add = (tag, text) => { changed.push(text); tags.push(tag); };
    if (g('viewmode') && +g('viewmode') !== 0) add('viewmode', `${T('view mode')} ${VIEWMODES[+g('viewmode')] || g('viewmode')}`);
    if (g('zoomamount') && Math.abs(+g('zoomamount') - 1) > 0.001) add('zoomamount', `${T('zoom')} ${(+g('zoomamount')).toFixed(2)}`);
    if (g('pixelratio') && Math.abs(+g('pixelratio') - 1) > 0.001) add('pixelratio', `${T('pixel ratio')} ${(+g('pixelratio')).toFixed(2)}`);
    if (g('verticalshift') && Math.abs(+g('verticalshift')) > 0.001) add('verticalshift', `${T('vertical shift')} ${(+g('verticalshift')).toFixed(2)}`);
    if (g('nonlinstretch') === 'true') add('nonlinstretch', T('non-linear stretch'));
    if (!changed.length) return;
    // evidence: only the changed lines of the <defaultvideosettings> block
    const hits = [], tagRe = new RegExp(`<(?:${tags.join('|')})>`);
    for (let j = a + 1; j < b; j++) if (tagRe.test(s.lines[j])) hits.push({ sec: 'guisettings.xml', line: j, n: s.startLine + j, text: s.lines[j] });
    const ev = { hits, count: hits.length };
    return { sev: 'info', text: T('The default view for all videos is changed: {0}.', changed.join(', ')),
      hint: T('All videos are then zoomed, stretched or shifted. Play a video, set the view back under Settings → Video settings and choose “Set as default for all media”.'), ev };
  } },
  { cat: 'display', check: d => {
    const z = d.gui.find(s => s.id === 'lookandfeel.skinzoom');
    if (z && +z.value) return { sev: 'info', text: T('Skin zoom is set to {0}%.', z.value), hint: T('Makes the menus larger or smaller; large values can push the menus off the screen.'),
      ev: find(d, 'guisettings.xml', /"lookandfeel\.skinzoom"/) };
  } },
  { cat: 'display', check: d => {
    const ev = find(d, 'Pi config-user', /^\s*(?:hdmi_\w+|overscan_\w+|disable_overscan|framebuffer_\w+|config_hdmi_boost|display_(?:hdmi_)?rotate|sdtv_mode)\s*=/i);
    if (!ev.count) return;
    const kms = /vc4-kms-v3d/.test(d.log.sec('Pi config'));
    return { sev: 'info', text: T('Display settings in config-user.txt: {0}.', ev.hits.map(h => h.text.trim()).join(', ')),
      hint: kms ? T('OSMC uses the KMS display driver (vc4-kms-v3d), which ignores many of these older settings or lets them conflict with the display settings in Kodi.')
        : T('Forced display settings can stop Kodi from using the display modes of the TV.'), ev };
  } },
  { cat: 'display', check: d => d.dvCap && /Support mode/.test(d.dvCap) && { sev: 'ok', text: T('The connected display reports Dolby Vision support.') } },
  { cat: 'display', check: d => d.kodi && d.kodi.playbacks.some(p => p.dovi) && { sev: 'ok', text: T('{0} playback(s) with Dolby Vision in the Kodi log.', d.kodi.playbacks.filter(p => p.dovi).length) } },

  // --- audio ---
  { cat: 'audio', check: d => {
    // audio settings by their English name, e.g. ab['Allow passthrough'] === 'false', and the formats the TV/receiver reports
    const ab = Object.fromEntries(d.abridged.map(s => [s.name, s.value]));
    const capTxt = d.audioCap.map(r => r[0]).join(' ');
    const hasAC3 = /AC-?3/i.test(capTxt), hasDDP = /Digital\+|E-?AC-?3|ATMOS/i.test(capTxt), hasMAT = /MAT|TrueHD/i.test(capTxt), hasDTS = /DTS/i.test(capTxt);
    const out = [];
    if (ab['Allow passthrough'] === 'false' && (hasAC3 || hasDDP || hasMAT || hasDTS))
      out.push({ sev: 'warn', text: T('Passthrough is disabled, but the connected device reports support for: {0}.', d.audioCap.map(r => r[0]).filter(f => !/^PCM/i.test(f)).join(', ')),
        hint: T('Turn on passthrough under Settings → System → Audio to send Dolby and DTS to the receiver unchanged.') });
    if (ab['Allow passthrough'] === 'true') {
      const miss = [];
      if (hasDDP && ab['Dolby Digital Plus (E-AC3) capable receiver'] === 'false') miss.push('Dolby Digital Plus (E-AC3)');
      if (hasMAT && ab['TrueHD capable receiver'] === 'false') miss.push('TrueHD (MAT)');
      if (hasDTS && ab['DTS capable receiver'] === 'false') miss.push('DTS');
      if (miss.length) out.push({ sev: 'info', text: T('Passthrough is enabled, but these formats reported by the device are not enabled in Kodi: {0}.', miss.join(', ')) });
    }
    const maxCh = Math.max(0, ...d.audioCap.map(r => parseInt(r[1]) || 0));
    if (ab['Number of channels'] && parseFloat(ab['Number of channels']) <= 2 && maxCh > 2)
      out.push({ sev: 'info', text: T('Number of channels is set to {0}, but the device reports up to {1} channels.', ab['Number of channels'], maxCh) });
    return out;
  } },

  // --- updates & packages ---
  { cat: 'updates', check: d => {
    const ev = find(d, ['OSMC Packages', 'All Other Packages'], /^[a-z][HUFWt]|^..R/);
    return ev.count && { sev: 'warn', text: T('Packages are not fully installed: {0}.', ev.hits.map(h => h.text.split(/\s+/)[1]).join(', ')),
      hint: T('An update was interrupted. Update again with My OSMC, or run: sudo apt-get update && sudo apt-get dist-upgrade'), ev };
  } },
  { cat: 'updates', check: d => {
    const ev = find(d, ['OSMC Packages', 'All Other Packages'], /^ii\s+\S*-image-\d/);
    return ev.count > 2 && { sev: 'warn', text: T('{0} kernels are installed.', ev.count),
      hint: T('Normally only the newest one or two are needed. Old kernels can fill up the boot partition and make updates fail.'), ev };
  } },
  { cat: 'updates', check: d => {
    const runs = parseAptHistory(d.log.sec('APT history.log'));
    const plain = /^Commandline: .*\bapt(?:-get)?\s+(?:-\S+\s+)*upgrade\b/;
    const out = [found('warn', find(d, 'APT history.log', plain), 'APT history shows {0} run(s) of “apt upgrade”.',
      'OSMC should be updated with My OSMC or “sudo apt-get dist-upgrade”. A plain “upgrade” can leave the system partly updated.')];
    out.push(found('warn', find(d, 'APT history.log', /^Error: /), 'Errors in the APT history ({0}×).', 'An update failed. Update again with My OSMC and check that there is enough free space.'));
    const created = Date.parse((d.log.created || '').slice(0, 10)), last = runs[0] && Date.parse(runs[0].start.slice(0, 10));
    const days = created && last ? Math.round((created - last) / 864e5) : 0;
    if (days > 180) out.push({ sev: 'info', text: T('The last update in the APT history was {0} ({1} days before the log was made).', runs[0].start.slice(0, 10), days),
      hint: T('Update with My OSMC → Updater. Many problems are already fixed in newer versions.') });
    return out;
  } },

  // --- database ---
  { cat: 'database', check: d => {
    const ev = find(d, KODI, kodiErr(/Unable to open database|Can't connect to (?:local )?(?:MySQL|MariaDB)|MySQL error|\[mysql\w*\]|Access denied for user|database disk image is malformed|SQLite error/i));
    if (!ev.count) return;
    const shared = /<(?:video|music)database>/.test(d.log.sec('advancedsettings.xml'));
    return { sev: 'bad', text: T('Database errors in the Kodi log ({0}×).', ev.count), ev,
      hint: shared ? T('Check the server address, user, password and database name in advancedsettings.xml, that the database server is running, and that all Kodi devices run the same Kodi version.')
        : T('The local library database may be damaged. Try cleaning the library, or restore a backup of the database.') };
  } },

  // --- about the log ---
  { cat: 'log', check: d => d.kodi && (d.kodi.debugLogging
    ? { sev: 'ok', text: T('Debug logging is enabled, so the Kodi log has full detail.') }
    : { sev: 'info', text: T('Debug logging is off.'), hint: T('For troubleshooting: enable it under Settings → System → Logging, reproduce the problem and make a new log with grab-logs -A.') }) },
  { cat: 'log', check: d => {
    // sections grab-logs failed to collect ("boot cmdline" always fails on Vero devices, so it is ignored)
    const errSecs = d.log.sections.filter(s => /^An error occurred while grabbing/m.test(s.text) && s.name !== 'boot cmdline');
    return errSecs.length && { sev: 'info', text: T('grab-logs could not collect: {0}.', errSecs.map(s => s.name).join(', ')) };
  } },
  { cat: 'log', check: d => {
    const cut = d.log.sections.filter(s => s.truncated);
    return cut.length && { sev: 'warn', text: T('The log file is cut off in: {0}.', cut.map(s => s.name).join(', ')), hint: T('Load the whole file; parts of the log are missing.') };
  } },
];

// Runs all rules -> findings with their category, most serious first. A rule that throws is skipped,
// so one broken rule can't break the page.
function problems(d) {
  const out = [], cats = Object.keys(CATS);
  for (const r of RULES) {
    let res;
    try { res = r.check(d); } catch (e) { console.error('Problem rule failed', r, e); continue; }
    for (const f of [].concat(res || [])) if (f) out.push({ ...f, cat: r.cat });
  }
  return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || cats.indexOf(a.cat) - cats.indexOf(b.cat));
}
// categories switched off in the Problems tab, remembered in this browser
function catsOff() {
  try { return new Set(JSON.parse(localStorage.getItem('osmclog.cats.off') || '[]')); } catch { return new Set(); }
}
// One finding in the Problems tab: category badge, text, advice and the log lines behind it. The first 5 lines
// are shown; the rest are folded away. Each line links to the same line in Raw sections.
function problemHtml(f) {
  const line = h => {
    const lv = /\s(error|warning)\s</.exec(h.text);
    return `<div${lv ? ` class="lv-${lv[1]}"` : ''}><a href="#" class="plain" data-sec="${esc(h.sec)}" data-line="${h.line}" title="${esc(T('Show in Raw sections'))}"><span class="ln">${h.n}</span>${esc(h.text)}</a></div>`;
  };
  let ev = '';
  if (f.ev && f.ev.hits.length) {
    const first = f.ev.hits.slice(0, 5), rest = f.ev.hits.slice(5);
    ev = `<div class="lines">${first.map(line).join('')}</div>`;
    if (rest.length) ev += `<details><summary>${esc(T('Show {0} more lines', rest.length))}</summary><div class="lines">${rest.map(line).join('')}</div></details>`;
    if (f.ev.count > f.ev.hits.length) ev += `<p class="muted">${esc(T('Showing {0} of {1}. Search Raw sections for the rest.', f.ev.hits.length, f.ev.count))}</p>`;
  }
  return `<li class="${f.sev}"><div>${badge(T(CATS[f.cat]))} ${esc(f.text)}</div>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}${ev}</li>`;
}

// ---------- rendering ----------
// Builds the whole result view from a parsed log. It is called again on a language switch and after the
// banned list is updated, so it must only depend on its arguments and global state (lang, banned, activeTab).
// Order: parse the sections -> build each tab as an HTML string -> insert the tabs -> wire up the interactive
// parts (search fields, checkboxes, selects), which need the elements to exist in the page first.
function render(log, fileName, fileSize) {
  const S = log.sec;   // S('Section name') -> section text
  const uname = parseUname(S('UNAME'));
  const cmd = parseCmdline(S('cmdline'));
  const kodiEntries = parseKodiLog(S('Kodi Log'));
  const kodi = kodiEntries.length ? analyzeKodi(kodiEntries) : null;
  const oldEntries = parseKodiLog(S('Kodi Old Log'));
  const oldKodi = oldEntries.length ? analyzeKodi(oldEntries) : null;
  // installed add-ons from both Kodi logs
  const allAddons = new Map();
  for (const [k, name] of [[kodi, 'Kodi Log'], [oldKodi, 'Kodi Old Log']]) {
    if (!k) continue;
    for (const [id, ver] of k.addons) {
      const a = allAddons.get(id) || { ver, logs: [] };
      a.logs.push(name);
      allAddons.set(id, a);
    }
  }
  const bannedMatches = matchBanned(allAddons);
  // parsed data shared by the tabs and the problem rules
  const d = {
    log, uname, cmd, kodi,
    abridged: parseAbridged(S('GUI Settings (abridged)')),
    gui: parseGuiSettings(S('guisettings.xml')),
    df: parseDf(S('Diskspace')),
    mem: parseFree(S('Memory')),
    ifaces: parseIfconfig(S('ifconfig')),
    audioCap: parseAudioCap(S('Audio Cap')),
    dvCap: S('Dolby Vision Cap'),
    edid: parseEdid(S('EDID')),
    bannedMatches,
  };
  // device name and OSMC version come from the Kodi log ("Running on OSMC Vero V with Open Source Media Center 2026.05-2");
  // without a Kodi log the device is guessed from osmcdev= on the kernel command line.
  // On a Raspberry Pi, Kodi just says "BCM2835", so the kernel's "Machine model:" line is used instead.
  const run = kodi && kodi.info.runningOn ? /^(?:OSMC )?(.+?) with Open Source Media Center ([^\s,]+)/.exec(kodi.info.runningOn) : null;
  const piModel = (/Machine model: (Raspberry Pi.*)/.exec(S('Kernel Message Log') + '\n' + S('System Journal')) || [])[1]?.trim();
  const soc = piModel ? piSoc(piModel) : '';
  const device = piModel || (run ? run[1] : ({ vero5: 'Vero V', vero3: 'Vero 4K / 4K+', vero2: 'Vero 2', rbp4: 'Raspberry Pi 4', rbp2: 'Raspberry Pi 2/3', rbp1: 'Raspberry Pi 1/Zero' }[cmd.osmcdev] || cmd.osmcdev));
  const osmcVer = run ? run[2] : '';
  const vic = (/VIC:(\d+)/.exec(S('Display Mode')) || [])[1];
  const root = d.df.find(x => x.mnt === '/');
  const eth = d.ifaces.find(i => i.inet && i.name !== 'lo');   // first real network interface with an address

  // tabs in display order; id is used for the panel element (p-<id>) and for switching tabs
  const tabs = [];
  const addTab = (id, label, html) => tabs.push({ id, label, html });

  // problem findings; categories switched off in the Problems tab are left out here and in the overview
  const off = catsOff();
  const allFound = problems(d), shown = allFound.filter(f => !off.has(f.cat));

  // --- Overview tab: key figures, observations (short list of the problems), system/Kodi/display/hardware, playbacks, banned add-ons ---
  let html = '<div class="stats">' + [
    [T('Device'), device], ['OSMC', osmcVer], ['Kodi', kodi && kodi.info.version], [T('Hostname'), uname.host],
    [T('IP address'), eth && eth.inet], [T('Uptime'), log.uptime != null ? fmtDuration(log.uptime) : ''],
  ].filter(x => x[1]).map(([l, v]) => `<div class="stat"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join('') + '</div>';
  html += card(T('Observations'), (shown.length ? '<ul class="obs">' + shown.map(f => `<li class="${f.sev}">${esc(f.text)}</li>`).join('') + '</ul>' : `<p class="empty">${T('Nothing notable found.')}</p>`)
    + `<p class="muted" style="margin:8px 0 0"><a href="#" data-goto="problems">${esc(T('Advice and log lines under Problems →'))}</a></p>`,
    T('automatic checks, not a guarantee'));
  html += '<div class="grid">';
  html += card(T('System'), kv([
    [T('Log created'), log.created], [T('Device'), device], [T('Chip (SoC)'), soc], [T('OSMC version'), osmcVer], [T('Kernel'), uname.kernel], [T('Architecture'), uname.arch],
    [T('Debian'), S('Debian version').trim()], [T('OSMC build'), S('OSMC Build Information').trim()],
    [T('RAM type'), cmd['osmcdev.ddr_type']], [T('CPU cores'), kodi && kodi.info.cores],
  ]));
  html += card('Kodi', kv([
    [T('Version'), kodi && kodi.info.version], [T('Platform'), kodi && kodi.info.platform], [T('Compiled'), kodi && kodi.info.compiled],
    [T('FFmpeg'), kodi && kodi.info.ffmpeg], [T('Skin'), kodi && kodi.info.skin],
    [T('Debug logging'), kodi ? yesNo(kodi.debugLogging) : ''], [T('Add-ons found'), kodi && kodi.addons.size],
  ]));
  html += card(T('Display'), kv([
    [T('TV/display'), [d.edid['Rx Product Name'], d.edid['Manufacture Year'] && `(${d.edid['Manufacture Year']})`].filter(Boolean).join(' ')],
    [T('Manufacturer code'), d.edid['Rx Manufacturer Name']],
    [T('Current mode'), vic ? `VIC ${vic}${VIC[vic] ? ' = ' + VIC[vic] : ''}` : ''],
    [T('GUI'), kodi && kodi.info.guiFormat],

  // --- Display & audio tab: EDID, HDR, Dolby Vision, display modes, audio formats and devices ---
  const nativeVic = (/native (\d+)/.exec(S('EDID')) || [])[1];
  html = '<div class="grid">';

    [T('Product name'), d.edid['Rx Product Name']], [T('Manufacturer'), d.edid['Rx Manufacturer Name']], [T('Product code'), d.edid['Rx Product Code']],

  ])));
  if (kodi && kodi.resolutions.length) html += card(T('Resolution changes in the Kodi log'), `<pre>${esc(kodi.resolutions.join('\n'))}</pre>`);

  // --- System tab: memory, network, APT sources, kernel command line, packages, APT history, journal/kernel errors ---
  html = '<div class="grid">';
  const mb = v => v != null ? v + ' MB' : '';
  html += card(T('Memory'), table(['', T('Total'), T('Used'), T('Free'), T('Cache'), T('Available')],
    Object.entries(d.mem).map(([k, m]) => [k, mb(m.total), mb(m.used), mb(m.free), mb(m.cache), mb(m.avail)])));
  html += card(T('Network interfaces'), table([T('Interface'), T('Address'), 'MAC', 'RX / TX', T('Errors')],
    d.ifaces.map(i => [i.name, [i.inet && `${i.inet}/${i.mask}`, i.inet6].filter(Boolean).join('\n'), i.ether || '', `${i.rx || '-'} / ${i.tx || '-'}`, `${i.rxErr || 0} / ${i.txErr || 0}`])));
  html += '</div>';
  const aptSrc = [S('APT sources.list'), S('APT sources.list.d')].join('\n').split('\n').filter(l => /^\s*deb/.test(l));

  html += card(T('Kernel command line'), '<div class="kvgrid">' + Object.entries(cmd).map(([k, v]) =>
    `<div><code>${esc(k)}</code><span>${v === true ? '' : esc(v)}</span></div>`).join('') + '</div>', 'cmdline');
  const osmcPk = parseDpkg(S('OSMC Packages'));

  // the other-packages table is filled by renderPk() below because it has a search field

      ${h.remove.length + h.purge.length ? badge(T('{0} removed', h.remove.length + h.purge.length), 'warn') : ''}${h.error ? badge(T('error'), 'bad') : ''}
      <span class="muted mono">${esc(h.cmd.replace(/^\/usr\/bin\/apt-get-real (-o \S+ )*/, 'apt-get ').slice(0, 90))}</span></summary>
      <div class="body">${h.error ? `<p class="badge bad">${esc(h.error)}</p>` : ''}${[['Installed', h.install], ['Upgraded', h.upgrade], ['Removed', h.remove], ['Purged', h.purge]].filter(x => x[1].length)
      .map(([l, p]) => `<h4>${esc(T(l))}</h4><div class="lines">${p.map(x => `<div>${esc(x)}</div>`).join('')}</div>`).join('')}</div></details>`).join('') : `<p class="empty">${T('None')}</p>`, T('newest first'));

  const kErr = groupJournal(S('Kernel Message Log'), /\b(error|failed|fail|warning|timeout|unable)\b/i);

  addTab('system', T('System'), html);

  // --- Kodi log tab: only the log selector here; the content is built by renderKl() below ---
  const kodiLogs = ['Kodi Log', 'Kodi Old Log'].filter(n => S(n).trim());

  html = `<div class="toolbar"><input type="search" id="raw-q" placeholder="${esc(T('Search the whole log (at least 2 characters)…'))}">

  // --- insert the tabs into the page ---
  const tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels');

  panelsEl.innerHTML = tabs.map(t => `<div class="panel" id="p-${t.id}">${t.html}</div>`).join('');

  // One click handler for all panels (event delegation), so it survives re-rendering:
  //   data-goto="<tab id>"           link that switches tab (e.g. "See details under Kodi log")
  //   data-sec="<section>" data-line="<n>"   link to line n of a section in the Raw sections tab
  //   data-action="refresh-banned"   the "Update from kodi.wiki" button
  panelsEl.onclick = async e => {

  pkQ.oninput = renderPk; renderPk();

  // Kodi log tab content for the selected log (current or previous Kodi log): figures, info, grouped errors,
  // playbacks with full details and installed add-ons with their banned status
  const klSel = document.getElementById('kl-sel'), klOut = document.getElementById('kl-out');
  const renderKl = () => {
    const name = klSel.value;
    if (!name) { klOut.innerHTML = `<p class="empty">${T('No Kodi log in the file.')}</p>`; return; }
    const entries = name === 'Kodi Log' ? kodiEntries : parseKodiLog(S(name));
    const k = name === 'Kodi Log' ? kodi : analyzeKodi(entries);
    if (!k) { klOut.innerHTML = `<p class="empty">${T('Could not read the log.')}</p>`; return; }
    let h = '<div class="stats">' + [
      [T('Lines'), entries.length], [T('Errors'), k.levels.error || 0], [T('Warnings'), k.levels.warning || 0],
      [T('Time span'), k.first ? `${k.first.time.slice(0, 8)} – ${k.last.time.slice(0, 8)}` : ''], [T('Playbacks'), k.playbacks.length], [T('Add-ons'), k.addons.size],
    ].map(([l, v]) => `<div class="stat"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`).join('') + '</div>';
    h += card(T('Kodi info'), kv([[T('Version'), k.info.version], [T('Running on'), k.info.runningOn], [T('Compiled'), k.info.compiled], [T('FFmpeg'), k.info.ffmpeg],
      [T('Hostname'), k.info.hostname], [T('GUI'), k.info.guiFormat], [T('Debug logging'), yesNo(k.debugLogging)],
      [T('Log levels'), raw(Object.entries(k.levels).map(([l, n]) => badge(`${l}: ${n}`, l === 'error' ? 'bad' : l === 'warning' ? 'warn' : '')).join(' '))]]));
    const grp = [...k.groups.values()].sort((a, b) => b.count - a.count);
    // first/last time and the message link to that line in Raw sections
    const lineLink = (n, html) => `<a href="#" class="plain" data-sec="${esc(name)}" data-line="${n}" title="${esc(T('Show in Raw sections'))}">${html}</a>`;
    h += card(T('Errors and warnings'), table([T('Level'), T('Count'), T('First'), T('Last'), T('Message')], grp.map(g => [raw(badge(g.level, g.level === 'warning' ? 'warn' : 'bad')), g.count,
      raw(lineLink(g.firstLine, esc(g.first))), raw(lineLink(g.lastLine, esc(g.last))), raw(lineLink(g.firstLine, `<span class="mono">${esc(g.msg)}</span>`))]), { scroll: true }),
      esc(T('grouped, incl. “Skipped N duplicate messages” · click to show in Raw sections')));
    h += card(T('Playbacks'), k.playbacks.length ? k.playbacks.map(p => {
      const title = p.file || decodeURIComponent(p.url.split('?')[0]);
      return `<div class="pb"><div class="t">${esc(title.split('/').pop() || title)}</div>
        <div class="muted mono" style="overflow-wrap:anywhere">${esc(title)}</div>${kv([
          [T('Time'), `${p.start}${p.end ? ' → ' + p.end.slice(11) : ''}`],
          ...p.streams.map(s => [s.kind === 'Video' ? T('Video') : `${T('Audio')}${s.lang ? ' (' + s.lang + ')' : ''}`, s.desc]),
          [T('Subtitles'), p.subs], [T('Dolby Vision'), p.dovi], [T('DV codec'), p.dv], [T('Display mode'), p.res],
          [T('Audio output'), p.audio.length ? p.audio.join(' · ') : ''],
        ])}</div>`;
    }).join('') : `<p class="empty">${T('No playbacks in the log.')}</p>`);
    const bm = new Map(bannedMatches.map(m => [m.id, m]));
    // banned/suspect add-ons first, then alphabetical
    const addonRows = [...k.addons].sort((a, b) => (bm.has(b[0]) - bm.has(a[0])) || a[0].localeCompare(b[0]));
    h += card(T('Installed add-ons'), table([T('Add-on'), T('Version'), T('Type'), T('Status')], addonRows.map(([id, v]) => [raw(`<code>${esc(id)}</code>`), v,
      id.split('.')[0] + (id.split('.')[1] && /^(video|audio|image|program|album|artists|tvshows|movies)$/.test(id.split('.')[1]) ? '.' + id.split('.')[1] : ''), raw(bannedBadge(bm.get(id)))]), { scroll: true }),
      T('from CAddonMgr::FindAddons'));
    klOut.innerHTML = h;
  };
  klSel.onchange = renderKl; renderKl();

  // Raw sections tab. Without a search: every section as a collapsed <details>; its lines are only drawn
  // when it is opened, because some sections have thousands of lines. With a search (2+ characters):
  // only matching lines, highlighted, at most 300 per section. Line numbers refer to the original file.
  const rawQ = document.getElementById('raw-q'), rawOut = document.getElementById('raw-out'), rawInfo = document.getElementById('raw-info'), rawSort = document.getElementById('raw-sort');
  try { rawSort.value = localStorage.getItem('osmclog.rawsort') || 'log'; } catch {}
  const sortedSections = () => {
    const list = log.sections.map((s, i) => ({ s, i }));
    if (rawSort.value === 'az') list.sort((a, b) => a.s.name.localeCompare(b.s.name, undefined, { sensitivity: 'base' }));
    return list;
  };
  // one log line with its line number; Kodi error/warning lines are coloured; re highlights search hits
  const lineHtml = (l, n, re) => {
    const lv = /\s(error|warning)\s</.exec(l);
    let t = esc(l);
    if (re) t = t.replace(re, m => `<mark>${m}</mark>`);
    return `<div${lv ? ` class="lv-${lv[1]}"` : ''}><span class="ln">${n}</span>${t}</div>`;
  };
  // draws the lines of a collapsed section the first time it is opened
  const fillRaw = det => {
    const body = det.querySelector('.body');
    if (body.innerHTML) return;
    const s = log.sections[det.dataset.i];
    body.innerHTML = `<div class="lines">${s.lines.map((l, j) => lineHtml(l, s.startLine + j)).join('')}</div>`;
  };
  // Shows line j (0-based) of a section in the Raw sections tab: clears any search, opens the section,
  // highlights the line and scrolls it into view. Used by the links in the Kodi log tab.
  const gotoLine = (name, j) => {
    clearTimeout(rawT);
    if (rawQ.value) { rawQ.value = ''; renderRaw(); }
    show('raw');
    const det = rawOut.querySelector(`details[data-i="${log.sections.indexOf(log.byName[name])}"]`);
    if (!det) return;
    det.open = true; fillRaw(det);
    rawOut.querySelector('.lines .target')?.classList.remove('target');
    const el = det.querySelector('.lines').children[j];
    if (el) { el.classList.add('target'); el.scrollIntoView({ block: 'center' }); }
  };
  const renderRaw = () => {
    const q = rawQ.value.trim();
    if (q.length < 2) {
      rawInfo.textContent = T('{0} sections', log.sections.length);
      rawOut.innerHTML = sortedSections().map(({ s, i }) => `<details data-i="${i}"><summary><span class="name">${esc(s.name)}</span>
        ${badge(T('{0} lines', s.lines.length))}${s.truncated ? badge(T('truncated'), 'warn') : ''}${/^An error occurred while grabbing/m.test(s.text) ? badge(T('collection error'), 'warn') : ''}
        ${!s.text.trim() ? badge(T('empty')) : ''}</summary><div class="body"></div></details>`).join('');
      rawOut.querySelectorAll('details').forEach(det => det.addEventListener('toggle', () => { if (det.open) fillRaw(det); }));
      return;
    }
    // the search text is matched literally; reEsc is the same search for the HTML-escaped line used for highlighting
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const reEsc = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let total = 0;
    const parts = [];
    for (const { s } of sortedSections()) {
      const hits = [];
      s.lines.forEach((l, j) => { re.lastIndex = 0; if (re.test(l)) hits.push([l, s.startLine + j]); });
      if (!hits.length) continue;
      total += hits.length;
      parts.push(`<details open><summary><span class="name">${esc(s.name)}</span>${badge(hits.length === 1 ? T('1 hit') : T('{0} hits', hits.length), 'acc')}</summary>
        <div class="body"><div class="lines">${hits.slice(0, 300).map(([l, n]) => lineHtml(l, n, reEsc)).join('')}</div>
        ${hits.length > 300 ? `<p class="muted">${esc(T('Showing 300 of {0}.', hits.length))}</p>` : ''}</div></details>`);
    }
    rawInfo.textContent = T('{0} hits in {1} sections', total, parts.length);
    rawOut.innerHTML = parts.join('') || `<p class="empty">${T('No hits.')}</p>`;
  };
  let rawT;   // debounce timer, so the whole log is not searched on every key press
  rawQ.oninput = () => { clearTimeout(rawT); rawT = setTimeout(renderRaw, 200); };
  rawSort.onchange = () => { try { localStorage.setItem('osmclog.rawsort', rawSort.value); } catch {} renderRaw(); };
  renderRaw();

  document.getElementById('fileinfo').textContent = T('{0} · {1} · {2} sections', fileName, fmtBytes(fileSize), log.sections.length) + (uname.host ? ' · ' + uname.host : '');
  document.title = `${T('OSMC Log Analyzer')} – ${uname.host || fileName}`;
}

// ---------- language ----------
// The loaded log ({ log, name, size }), kept so the page can be re-rendered on a language switch.
let current = null;
// A newly loaded log always opens on the overview; a language switch keeps the current tab.
let activeTab = 'overview';
// earlier versions remembered the last tab; remove that leftover setting
try { localStorage.removeItem('osmclog.tab'); } catch {}
// Translates the static texts (data-i18n / data-i18n-html) and re-renders the result view, if any.
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  document.querySelectorAll('#langsw button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  if (current) render(current.log, current.name, current.size); else document.title = T('OSMC Log Analyzer');
}
// DA/EN buttons: load the language file first, then switch and remember the choice.
document.getElementById('langsw').onclick = async e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.lang === lang) return;
  await loadLang(b.dataset.lang);
  lang = b.dataset.lang;
  try { localStorage.setItem('osmclog.lang', lang); } catch {}
  applyLang();
};

// ---------- loading ----------
const drop = document.getElementById('drop'), fileIn = document.getElementById('file');
// Reads a log file (File object), splits it and shows the result. Waits for the language file and the
// banned list so the first render is complete.
async function load(file) {
  const buf = await file.arrayBuffer();
  const text = fixMojibake(new TextDecoder('utf-8').decode(buf));
  const log = parseLog(text);
  await Promise.all([bannedReady, langReady]);
  if (!log.sections.length) { alert(T('Could not find any OSMC log sections in the file. Is it a log from grab-logs?')); return; }
  try {
    activeTab = 'overview';
    render(log, file.name, file.size);
    window.scrollTo(0, 0);
  } catch (err) {
    console.error(err);
    alert(T('Error during analysis: {0}', err.message));
    return;
  }
  current = { log, name: file.name, size: file.size };
  drop.hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('tabs').hidden = false;
  document.getElementById('reload').hidden = false;
}
// File picker: the drop zone and the "Load another log" button both open it. The value is cleared so
// choosing the same file again still triggers a change.
drop.onclick = () => fileIn.click();
document.getElementById('reload').onclick = () => fileIn.click();
fileIn.onchange = () => { if (fileIn.files[0]) load(fileIn.files[0]); fileIn.value = ''; };
// Drag & drop works anywhere on the page; the drop zone is highlighted while a file is dragged over it.
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) load(f); });
// Start-up: load the banned list and the language file in parallel; load() waits for both.
const bannedReady = loadBanned();
const langReady = loadLang(lang).then(applyLang);
</script>
</body>
</html>
